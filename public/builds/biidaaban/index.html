    /* ── Camera AR: terminal landing page (unchanged) ─────────────────── */

    @media (prefers-reduced-motion: reduce) {

    }</style></head><body><div id="splash-screen" class="ui-3d"><div id="splash-panels" aria-hidden="true"><img src="./assets/ui/splash-panel-1.jpg" alt=""> <img src="./assets/ui/splash-panel-2.jpg" alt=""> <img src="./assets/ui/splash-panel-3.jpg" alt=""></div><div><h1 id="splash-title">Biidaaban</h1><p id="splash-byline">Will Morin and Quinn Hopkins</p></div><div id="loading-bar-container" role="progressbar" aria-label="Loading the panels"><div id="loading-bar"></div></div><button id="start-btn" type="button">Enter</button></div><a id="brand-home" href="/" target="_top" aria-label="Noodin Studio XR, back to the works"><img id="brand-logo" src="./assets/ui/noodin-logo.webp" alt=""></a><p id="brand-credit" class="ui-3d">&copy; 2026 Will Morin and Quinn Hopkins &middot; Noodin Studio</p><a id="ar-btn" class="ui-3d" href="?view=ar" aria-label="Open in AR">AR</a> <button id="tilt-btn" class="ui-3d" type="button" aria-label="Look around by tilting your phone">Tilt</button> <button id="sound-hint" class="ui-3d" type="button">Tap for sound</button><div id="desktop-hint" class="ui-3d"><span class="hint-mouse">Move your mouse</span><span class="hint-touch">Tilt or drag</span> to look inside.</div><button id="carousel-prev" class="carousel-arrow ui-3d" type="button" aria-label="Previous panel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button> <button id="carousel-next" class="carousel-arrow ui-3d" type="button" aria-label="Next panel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><section id="story" class="ui-3d" aria-label="Story"><p id="story-caption" aria-live="polite"></p><p id="story-label"></p><div id="story-row"><button id="play-btn" type="button">Play the story</button> <button id="cc-btn" type="button" aria-label="Captions" aria-pressed="true">CC</button></div><nav id="carousel-dots" aria-label="Panels"></nav></section><div id="lp-root"><div id="lp-terminal"><div id="lp-lines"></div><div><span id="lp-cursor">_</span></div><div style="text-align:center;"><button id="lp-enter">[ &gt; ENTER ]</button></div></div></div><script src="bundle.js"></script><script>(function () {

        delay: 40,

      },
      {
        text:  '  QUINN HOPKINS  +  WILL MORIN',
        css:   'font-size:14px;color:' + BRIGHT + ';letter-spacing:0.1em;margin-bottom:20px',
        delay: 38,
        pause: 500

      { hr: true },
      {
        text:  '> FOR THE ARTHUR B. MCDONALD CANADIAN ASTROPARTICLE PHYSICS RESEARCH INSTITUTE',
        css:   'font-size:13px;color:' + DIM + ';letter-spacing:0.06em;margin-top:4px;line-height:1.5',
        delay: 14,
        pause: 0
      },
      {
        text:  '  IN PARTNERSHIP WITH THE QUEEN\'S UNIVERSITY OFFICE OF INDIGENOUS INITIATIVES',
        css:   'font-size:13px;color:' + DIM + ';letter-spacing:0.06em;line-height:1.5',
        delay: 14,
        pause: 0
      },
      {
        text:  '  AND QUEEN\'S DEPARTMENT OF PHYSICS, ENGINEERING PHYSICS AND ASTRONOMY.',
        css:   'font-size:13px;color:' + DIM + ';letter-spacing:0.06em;margin-bottom:4px;line-height:1.5',
        delay: 14,
        pause: 700
      }
    ]

    var linesEl  = document.getElementById('lp-lines')
    var cursorEl = document.getElementById('lp-cursor')
    var enterBtn = document.getElementById('lp-enter')

    function runSeq(idx, done) {
      if (idx >= SEQ.length) { done(); return }

      var item  = SEQ[idx]
      var after = item.pause != null ? item.pause : 200

      // Horizontal rule
      if (item.hr) {
        var hr = document.createElement('div')
        hr.style.cssText =
          'border:none;border-top:1px solid ' + DIM +
          ';margin:14px 0'
        linesEl.appendChild(hr)
        setTimeout(function () { runSeq(idx + 1, done) }, 80)
        return
      }

      // Text line
      var div = document.createElement('div')
      div.style.cssText = item.css || ''
      linesEl.appendChild(div)

      var speed = item.delay != null ? item.delay : 30
      var text  = item.text
      var ci    = 0

      function tick() {
        if (ci < text.length) {
          div.textContent += text[ci++]
          setTimeout(tick, speed)
        } else {
          setTimeout(function () { runSeq(idx + 1, done) }, after)
        }
      }
      tick()
    }

    runSeq(0, function () {
      cursorEl.style.display = 'none'
      enterBtn.style.display = 'inline-block'
    })

    // ── ENTER button ────────────────────────────────────────────────────
    enterBtn.addEventListener('click', function () {
      root.style.pointerEvents = 'none'
      root.style.opacity = '0'
      setTimeout(function () { root.style.display = 'none' }, 700)
    })
  })()</script></body></html>
